<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Platform API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f8fafc; color: #0f172a; display: flex;
           align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0;
            padding: 2.5rem; max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 56px; height: 56px; background: #2563eb; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; }
    .icon svg { width: 28px; height: 28px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
    p  { color: #64748b; font-size: .925rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn { display: inline-block; padding: .7rem 1.5rem; background: #2563eb;
           color: white; border-radius: 10px; text-decoration: none;
           font-weight: 600; font-size: .9rem; margin: .25rem;
           transition: background .2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-ghost { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
    .btn-ghost:hover { background: #f1f5f9; }
    .tag { display: inline-block; padding: .2rem .6rem; border-radius: 999px;
           font-size: .75rem; font-weight: 500; margin: .2rem;
           background: #eff6ff; color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <h1>Invoice Platform API</h1>
    <p>The REST API is running. Open the frontend to use the app, or use the HTTP client to explore the API directly.</p>
    <div style="margin-bottom:1.5rem">
      <span class="tag">Spring Boot 4.1</span>
      <span class="tag">PostgreSQL</span>
      <span class="tag">JWT Auth</span>
      <span class="tag">Phase 2 Async</span>
    </div>
    <div>
      <a href="http://localhost:5173" class="btn">Open App →</a>
      <a href="/actuator/health" class="btn btn-ghost">Health Check</a>
    </div>
    <p style="margin-top:1.5rem;font-size:.8rem;color:#94a3b8">
      API runs on <strong>:8080</strong> &nbsp;·&nbsp; UI runs on <strong>:5173</strong>
    </p>
  </div>
</body>
</html>
